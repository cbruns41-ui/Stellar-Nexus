<!DOCTYPE html>
<html lang="de" class="play">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#03050a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nexus" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Stellar Nexus — Kommando</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/assets/emblem.jpg" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-512.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&family=Tektur:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css?v=98" />
  </head>
  <body data-mode="play">
    <canvas id="stars" aria-hidden="true"></canvas>
    <div id="scan" aria-hidden="true"></div>

    <div id="game" class="shell">
      <header class="topbar">
        <div class="brand">
          <button type="button" id="brand-profile" class="brand-avatar-btn" title="Spielerprofil">
            <img id="brand-avatar" src="/assets/emblem.jpg" alt="" />
          </button>
          <div>
            <strong id="empire-name">Lade…</strong>
            <select id="planet-select" class="planet-select" title="Planet wechseln"></select>
          </div>
        </div>
        <div class="resources" id="resources"></div>
        <div class="top-actions">
          <span id="clock" class="clock"></span>
          <form method="post" action="/api/auth/logout">
            <button id="logout" class="btn ghost" type="submit">Abmelden</button>
          </form>
        </div>
      </header>

      <nav class="nav" id="nav">
        <div class="nav-sheet-handle" aria-hidden="true"></div>
        <div class="nav-section">
          <span class="nav-group">Kommando</span>
          <button data-view="alliance">Allianz <i data-badge="alliance" hidden></i></button>
          <button data-view="reports">Funk <i data-badge="reports" hidden></i></button>
          <button data-view="chat">Chat <i data-badge="chat" hidden></i></button>
          <button data-view="activity">Einsatz <i data-badge="activity" hidden></i></button>
          <button data-view="nexus">Nexus <i data-badge="nexus" hidden></i></button>
          <button data-view="sim">Simulator</button>
          <button data-view="progress">Orden</button>
        </div>
        <div class="nav-section">
          <span class="nav-group">Bauen</span>
          <button data-view="infra">Gebäude <i data-badge="infra" hidden></i></button>
          <button data-view="yard">Werft <i data-badge="yard" hidden></i></button>
          <button data-view="research">Labor <i data-badge="research" hidden></i></button>
          <button data-view="defense">Verteidigung <i data-badge="defense" hidden></i></button>
          <button data-view="tree">Tech-Tree</button>
          <button data-view="economy">Rohstoffe <i data-badge="economy" hidden></i></button>
        </div>
        <div class="nav-section">
          <span class="nav-group">Reich</span>
          <button data-view="empire">Imperium</button>
          <button data-view="ranks">Rangliste</button>
          <button data-view="settings">Optionen</button>
          <a class="nav-help" href="/help.html">Hilfe</a>
        </div>
        <div class="nav-section" id="nav-staff" hidden>
          <span class="nav-group">Leitung</span>
          <button data-view="moderation">Zentrale</button>
        </div>
      </nav>
      <div id="nav-backdrop" class="nav-backdrop hidden" hidden></div>

      <div id="alert-strip" class="alert-strip hidden" hidden></div>
      <main id="view" class="view"><p class="muted" style="padding:24px">Verbinde mit dem Nexus…</p></main>
      <aside class="dock" id="dock"></aside>
      <nav class="tabbar" id="tabbar">
        <button type="button" data-view="command" data-tab="home" class="on">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg>
          Planet <i data-badge="command" hidden></i>
        </button>
        <button type="button" data-view="galaxy" data-tab="map">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 5v2M12 17v2M5 12h2M17 12h2"/></svg>
          Karte <i data-badge="galaxy" hidden></i>
        </button>
        <button type="button" data-open-nav="1" data-tab="cmd">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
          Kommando <i data-badge="more" hidden></i>
        </button>
      </nav>
    </div>

    <div id="toasts" class="toasts"></div>
    <div id="modal" class="modal hidden" hidden></div>

    <script src="/js/play-boot.js?v=21"></script>
    <script src="/js/pwa.js?v=2"></script>
    <script type="module" src="/js/app.js?v=130"></script>
  </body>
</html>
