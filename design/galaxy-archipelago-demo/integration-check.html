<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Archipel – Integrationsprüfung</title><link rel="stylesheet" href="/css/style.css"></head><body class="shell view-galaxy" data-mode="play">
<main class="map-wrap" style="position:fixed;inset:0;width:100vw;height:100dvh;margin:0">
<canvas id="starmap"></canvas><button class="map-search-toggle" aria-label="Suche">⌕</button><button class="map-filter-toggle" aria-label="Filter">☷</button><div class="map-status"><span>INTEGRATIONSPRÜFUNG</span></div>
<div class="map-raid-banner" id="map-raid-banner">Piraten-Raid · Prüfdaten</div><button id="map-orbit-fire" class="map-orbit-fire">Orbit-Feuer</button><div id="sysbox"></div></main>
<script type="module">
import{createMap,systemHtml}from'./integration/archipelago-integration.mjs';
const box=document.querySelector('#sysbox'),canvas=document.querySelector('canvas'),actions=[];let map,selections=0;
const own={id:11,name:'Commander',color:'#88ddff'},ally={id:12,name:'Allianzmitglied',color:'#9eddaa',alliance:{id:4,tag:'NEME'}};
const planet=(id,name,owner,extra={})=>({id,name,type:'terran',typeName:'Terranisch',size:3,owner,own:owner?.id===11,canManage:owner?.id===11,...extra});
const details={1:{id:1,name:'Neme',star:{name:'Gelber Zwerg'},planets:[planet(101,'Neme I',own,{ships:{fighter:6},isHome:true}),planet(102,'Neme II',null)]},2:{id:2,name:'Kael',star:{name:'Blauer Riese'},planets:[planet(201,'Kael I',ally,{canStation:true}),planet(202,'Kael II',null)]},3:{id:3,name:'Pyre',pirate:4,remnant:true,star:{name:'Roter Stern'},remnantShips:{fighter:4},planets:[planet(301,'Pyre I',null),planet(302,'Pyre II',null)]}};
const data={now:Date.now(),self:{empireId:11,allianceId:4,homeSystemId:1,homePlanetId:101},systems:[{id:1,name:'Neme',x:1600,y:1600,owners:[{empireId:11,planets:1,allianceId:4}],planetCount:2,planetNames:['Neme I','Neme II'],fleetCount:6},{id:2,name:'Kael',x:900,y:1800,owners:[{empireId:12,planets:1,allianceId:4}],planetCount:2,planetNames:['Kael I','Kael II']},{id:3,name:'Pyre',x:800,y:900,owners:[],planetCount:2,planetNames:['Pyre I','Pyre II'],pirate:4,remnant:true}],links:[{a:1,b:2},{a:2,b:3}],flights:[{id:9,originSystemId:2,targetSystemId:1,shipCount:3,mission:'colonize',departedAt:Date.now()-30000,arrivesAt:Date.now()+60000,friendly:true,returning:true}]};
function select(s,opts){selections++;if(!s){box.replaceChildren();return;}box.innerHTML=systemHtml(details[s.id],{ships:{fighter:{name:'Jäger'}},missions:{}},{fighter:6},{highlightPlanetId:opts?.planetId,orbitSiege:{playsLeft:1},flights:[]});box.querySelector('[data-sys-close]').onclick=()=>{box.replaceChildren();map.setHighlight(null);};for(const b of box.querySelectorAll('[data-target],[data-focus],[data-orbit-mode]'))b.onclick=()=>actions.push({planet:Number(b.dataset.target||b.dataset.focus||b.dataset.orbitPlanet),mission:b.dataset.missionKind||b.dataset.orbitMode||'focus'});}
function mount(){map?.destroy();map=createMap(canvas,select);map.setData(data);return map;}
mount();window.contract={get map(){return map;},data,actions,get selections(){return selections;},mount,ready:false};await map.ready;map.focusPlanet(102,1);window.contract.ready=true;
</script></body></html>
